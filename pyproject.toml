[project]
name = "sangyong-datasets"
version = "0.1.0"
description = "Daily dataset collection pipeline"
requires-python = ">=3.12,<3.15"
dependencies = [
    "dagster>=1.9",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver>=1.9",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.dagster]
module_name = "pipeline.definitions"
code_location_name = "sangyong_datasets"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network: hits real external APIs; excluded from CI",
]
