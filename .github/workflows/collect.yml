name: collect

on:
  schedule:
    # 21:00 UTC = 06:00 KST, after the previous KST day has fully closed.
    # GitHub may delay scheduled runs under load, and disables them on repos
    # with no activity for 60 days -- the data commits keep that alive.
    - cron: "0 21 * * *"
    # Feed sources expose only the last hour or two, so once a day would miss
    # almost everything. Asking every thirty minutes rather than every hour is
    # a hedge against GitHub's scheduler: an hourly ask was delivered at
    # 49-174 minute intervals, and the Yonhap window is about ninety, which
    # cost us four hours of articles on 2026-08-27.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      group:
        description: "Which cadence to run."
        required: false
        default: daily
        type: choice
        options: [daily, hourly, all]
      start_date:
        description: "First partition date (YYYY-MM-DD). Blank = each source's due day."
        required: false
      end_date:
        description: "Last partition date, inclusive. Blank = same as start."
        required: false
      sources:
        description: "Comma-separated source names. Overrides group."
        required: false

permissions:
  contents: write

# Runs write the same files and push to the same branch; the hourly and daily
# schedules collide at 21:00 UTC.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          # The commit step rebases before pushing; a shallow clone cannot.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run tests
        # Guards against committing data produced by broken normalizers.
        run: uv run pytest -q

      - name: Collect
        id: collect
        env:
          # Raises the Search API rate limit; no extra secret to manage.
          GITHUB_TOKEN: ${{ github.token }}
          # Passed as env rather than interpolated into the script, so a
          # dispatch input cannot inject shell.
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_GROUP: ${{ inputs.group }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          SOURCES: ${{ inputs.sources }}
        run: |
          if [ -n "$INPUT_GROUP" ]; then
            GROUP="$INPUT_GROUP"
          elif [ "$SCHEDULE" = "*/30 * * * *" ]; then
            GROUP=hourly
          else
            GROUP=daily
          fi
          echo "group: $GROUP"

          ARGS=(--group "$GROUP")
          if [ -n "$START_DATE" ]; then ARGS+=(--start "$START_DATE"); fi
          if [ -n "$END_DATE" ]; then ARGS+=(--end "$END_DATE"); fi
          if [ -n "$SOURCES" ]; then ARGS+=(--sources "$SOURCES"); fi
          uv run python -m pipeline.cli "${ARGS[@]}"

      - name: Commit data
        # Runs even when a source failed: partial data is still worth keeping,
        # and the job stays red because the Collect step already failed.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          git add data
          if git diff --cached --quiet; then
            echo "no new data to commit"
            exit 0
          fi
          git commit -m "data: collect $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
